version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    # The verified-* crates are moved deliberately, and wasm-bindgen moves
    # together with the command that post-processes the module; see
    # CONTRIBUTING.md.
    ignore:
      - dependency-name: "verified-*"
      - dependency-name: "wasm-bindgen"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The Node types follow the oldest supported Node, not the newest.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
